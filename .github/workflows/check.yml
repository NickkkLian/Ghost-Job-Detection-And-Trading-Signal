name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  synthetic:
    # The pipeline end to end on synthetic data (no licence, no network), plus the no-lookahead test.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-synthetic.txt
      - run: pip install -r requirements-synthetic.txt
      - run: python scripts/check.py

  break:
    # Breaking the data or the backtester's time gate on purpose must turn the checks red.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-synthetic.txt
      - run: pip install -r requirements-synthetic.txt
      - run: python scripts/check.py --break
